<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primera página interactiva</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e0f2fe; color: #0f172a; transition: background 0.4s; }
    main { max-width: 560px; margin: 24px; padding: 40px; text-align: center; background: white; border-radius: 20px; box-shadow: 0 10px 30px #0f172a22; }
    h1 { color: #2563eb; }
    p { line-height: 1.6; }
    button { border: 0; border-radius: 999px; padding: 13px 22px; background: #2563eb; color: white; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    body.sorpresa { background: #fef3c7; }
  </style>
</head>
<body>
  <main>
    <h1>¡Hola!</h1>
    <p>Esta es mi primera página web publicada con GitHub.</p>
    <p id="mensaje">Pulsa el botón para darle vida.</p>
    <button id="boton">Sorpréndeme</button>
  </main>
  <script>
    const boton = document.querySelector("#boton");
    const mensaje = document.querySelector("#mensaje");

    boton.addEventListener("click", () => {
      const activa = document.body.classList.toggle("sorpresa");
      mensaje.textContent = activa
        ? "¡Bien! Acabas de usar JavaScript para cambiar la página."
        : "Pulsa el botón para darle vida.";
      boton.textContent = activa ? "Volver" : "Sorpréndeme";
    });
  </script>
</body>
</html>
